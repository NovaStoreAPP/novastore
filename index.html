<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Apps</title>
<style>
  :root{
    --green:#01875f;--green-dark:#016a4b;--bg:#f6f8f7;--card:#ffffff;
    --border:#e3e7e5;--text:#1a1c1e;--text-secondary:#5f6368;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  .header-inner{max-width:900px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:10px}
  .logo{display:flex;align-items:center;gap:10px}
  .logo-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#4f7cff 0%,#7b5cff 30%,#c04cff 60%,#ff5f8f 100%);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 3px 10px rgba(123,92,255,.35)}
  .logo-text{font-weight:800;font-size:20px;letter-spacing:-.3px;background:linear-gradient(135deg,#4f7cff,#c04cff 60%,#ff5f8f);-webkit-background-clip:text;background-clip:text;color:transparent}
  main{max-width:900px;margin:0 auto;padding:20px}
  .searchbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:10px 18px;margin-bottom:20px}
  .searchbar input{border:none;outline:none;background:transparent;flex:1;font-size:15px;font-family:inherit;color:var(--text)}
  .searchbar svg{flex-shrink:0;color:var(--text-secondary)}
  .app-row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
  .app-icon{width:56px;height:56px;border-radius:14px;flex-shrink:0;object-fit:cover;background:#eee;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px}
  .app-info{flex:1;min-width:0}
  .app-name{font-weight:600;font-size:15px;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app-meta{font-size:13px;color:var(--text-secondary);margin:0 0 4px}
  .app-desc{font-size:12.5px;color:var(--text-secondary);margin:0 0 6px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
  .badge-github{background:#eef2ff;color:#3730a3}
  .badge-web{background:#e8f0fe;color:#1a56c4}
  .badge-play{background:#fbe9e7;color:#c2410c}
  .btn-download{flex-shrink:0;background:var(--green);color:#fff;border:none;padding:9px 18px;border-radius:20px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block;transition:background .15s}
  .btn-download:hover{background:var(--green-dark)}
  .empty{text-align:center;padding:60px 20px;color:var(--text-secondary)}
  .empty svg{margin-bottom:12px;opacity:.5}
  .load-panel{background:var(--card);border:1px dashed var(--border);border-radius:16px;padding:24px;text-align:center;margin-bottom:20px}
  .load-panel p{color:var(--text-secondary);font-size:13px;margin:0 0 12px}
  .btn-secondary{background:transparent;color:var(--green);border:1px solid var(--green);padding:9px 18px;border-radius:20px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
  @media (max-width:600px){.logo-text{display:none}.app-icon{width:48px;height:48px;border-radius:12px;font-size:17px}}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 9.5 12 4l8 5.5V19a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1V9.5Z" fill="#fff"/>
        </svg>
      </div>
      <div class="logo-text">NovaStore</div>
    </div>
  </div>
</header>

<main>
  <div class="searchbar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search-input" placeholder="Buscar apps">
  </div>

  <div class="load-panel" id="load-panel" style="display:none">
    <p>No se pudo cargar apps.json automáticamente (esto pasa si abres el archivo con doble clic en lugar de un servidor local). Selecciónalo a mano:</p>
    <button class="btn-secondary" onclick="document.getElementById('file-input').click()">Seleccionar apps.json</button>
    <input type="file" id="file-input" accept=".json" style="display:none">
  </div>

  <div id="app-list"></div>
</main>

<script>
let apps=[];

function hashColor(str){
  let hash=0;
  for(let i=0;i<str.length;i++){hash=str.charCodeAt(i)+((hash<<5)-hash);}
  const hue=Math.abs(hash)%360;
  return `hsl(${hue},58%,48%)`;
}
function initials(name){return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()}
function badgeFor(tipo){
  if(tipo==='github')return '<span class="badge badge-github">GitHub</span>';
  if(tipo==='web')return '<span class="badge badge-web">Web oficial</span>';
  return '<span class="badge badge-play">Play Store</span>';
}
function escapeHtml(str){
  return String(str??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// El icono se crea siempre con el DOM (nunca insertando HTML dentro de un atributo
// onerror como string), así evitamos que las comillas del estilo rompan el markup.
function buildIconEl(app){
  const name=app.nombre||'app';
  if(app.icono){
    const img=document.createElement('img');
    img.className='app-icon';
    img.src=app.icono;
    img.alt='';
    img.addEventListener('error',()=>{
      img.replaceWith(buildFallbackIconEl(name));
    },{once:true});
    return img;
  }
  return buildFallbackIconEl(name);
}
function buildFallbackIconEl(name){
  const div=document.createElement('div');
  div.className='app-icon';
  div.style.background=hashColor(name);
  div.textContent=initials(name||'?');
  return div;
}

function renderCatalog(){
  const list=document.getElementById('app-list');
  const q=(document.getElementById('search-input').value||'').toLowerCase();
  const filtered=apps.filter(a=>(a.nombre||'').toLowerCase().includes(q));
  if(filtered.length===0){
    list.innerHTML=`<div class="empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 9h6v6H9z"/></svg>
      <p>${apps.length===0?'Todavía no hay apps en apps.json.':'No hay resultados para tu búsqueda.'}</p>
    </div>`;
    return;
  }
  list.innerHTML='';
  filtered.forEach(app=>{
    const row=document.createElement('div');
    row.className='app-row';
    row.appendChild(buildIconEl(app));

    const info=document.createElement('div');
    info.className='app-info';
    info.innerHTML=`
      <p class="app-name">${escapeHtml(app.nombre)}</p>
      <p class="app-meta">${escapeHtml(app.peso||'—')} · ${escapeHtml(app.categoria||'General')}</p>
      ${app.descripcion?`<p class="app-desc">${escapeHtml(app.descripcion)}</p>`:''}
      ${badgeFor(app.tipo)}
    `;
    row.appendChild(info);

    const link=document.createElement('a');
    link.className='btn-download';
    link.href=app.url;
    link.target='_blank';
    link.rel='noopener';
    link.textContent='Descargar';
    row.appendChild(link);

    list.appendChild(row);
  });
}

async function loadFromFetch(){
  try{
    const res=await fetch('apps.json',{cache:'no-store'});
    if(!res.ok)throw new Error('no ok');
    apps=await res.json();
    renderCatalog();
  }catch(e){
    document.getElementById('load-panel').style.display='block';
  }
}

document.getElementById('file-input').addEventListener('change',e=>{
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      apps=JSON.parse(ev.target.result);
      document.getElementById('load-panel').style.display='none';
      renderCatalog();
    }catch(err){alert('El archivo no es un JSON válido')}
  };
  reader.readAsText(file);
});

document.getElementById('search-input').addEventListener('input',renderCatalog);

loadFromFetch();
</script>
</body>
</html>
