<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaStore</title>
<meta name="description" content="NovaStore - Si han inventado la app, está aquí.">

<!-- Iconos / favicon -->
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="mask-icon" href="icons/icon-square-512.png" color="#7b5cff">

<!-- Instalar como app (PWA) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NovaStore">
<meta name="application-name" content="NovaStore">
<meta name="mobile-web-app-capable" content="yes">

<!-- Vista previa al compartir el enlace principal (WhatsApp, Telegram, etc.) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="NovaStore">
<meta property="og:title" content="NovaStore">
<meta property="og:description" content="Si han inventado la app, está aquí.">
<meta property="og:image" content="https://novastore-apps.netlify.app/share/banner.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="NovaStore">
<meta name="twitter:description" content="Si han inventado la app, está aquí.">
<meta name="twitter:image" content="https://novastore-apps.netlify.app/share/banner.png">

<script>
(function(){
  try{
    var saved=localStorage.getItem('novastore_theme');
    var theme=(saved==='light'||saved==='dark')?saved:(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
    document.documentElement.setAttribute('data-theme',theme);
  }catch(e){}
})();
</script>
<style>
  :root{
    --green:#01875f;--green-dark:#016a4b;--bg:#f6f8f7;--card:#ffffff;
    --border:#e3e7e5;--text:#1a1c1e;--text-secondary:#5f6368;
    --shadow:0 1px 3px rgba(16,24,22,.07);--overlay:rgba(0,0,0,.4);
    --badge-github-bg:#eef2ff;--badge-github-text:#3730a3;
    --badge-web-bg:#e8f0fe;--badge-web-text:#1a56c4;
    --badge-play-bg:#e6f7f4;--badge-play-text:#00806c;
    --badge-external-bg:#f1f0fe;--badge-external-text:#5b3fd6;
    --badge-telegram-bg:#e5f4fd;--badge-telegram-text:#0088cc;
    --status-ok-bg:#e6f7ee;--status-ok-text:#0a8a4c;
    --status-regular-bg:#fff6e0;--status-regular-text:#a06a00;
    --status-down-bg:#fdeaea;--status-down-text:#c0392b;
  }
  [data-theme="dark"]{
    --bg:#111315;--card:#1c1f22;--border:#2b2f33;
    --text:#f1f3f4;--text-secondary:#9aa0a6;
    --green:#15b381;--green-dark:#0f9068;
    --shadow:0 1px 3px rgba(0,0,0,.4);--overlay:rgba(0,0,0,.6);
    --badge-github-bg:#242850;--badge-github-text:#b7bdff;
    --badge-web-bg:#16324e;--badge-web-text:#8fc7ff;
    --badge-play-bg:#0f3a33;--badge-play-text:#7fe7cf;
    --badge-external-bg:#2a2450;--badge-external-text:#c6b8ff;
    --badge-telegram-bg:#0f2f42;--badge-telegram-text:#6dc6f0;
    --status-ok-bg:#123423;--status-ok-text:#4fd88b;
    --status-regular-bg:#3a2e0f;--status-regular-text:#ffcf5c;
    --status-down-bg:#3a1717;--status-down-text:#ff8a8a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s}
  header{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  .header-inner{max-width:900px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .logo{display:flex;align-items:center;gap:10px;min-width:0}
  .logo-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#4f7cff 0%,#7b5cff 30%,#c04cff 60%,#ff5f8f 100%);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 3px 10px rgba(123,92,255,.35)}
  .logo-text{font-weight:800;font-size:20px;letter-spacing:-.3px;background:linear-gradient(135deg,#4f7cff,#c04cff 60%,#ff5f8f);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
  .icon-btn{background:none;border:none;padding:9px;border-radius:50%;cursor:pointer;color:var(--text-secondary);display:flex;flex-shrink:0}
  .icon-btn:active{background:var(--bg)}
  main{max-width:900px;margin:0 auto;padding:18px 16px 40px}

  .searchbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:24px;padding:10px 18px;margin-bottom:12px}
  .searchbar input{border:none;outline:none;background:transparent;flex:1;font-size:15px;font-family:inherit;color:var(--text);min-width:0}
  .searchbar svg{flex-shrink:0;color:var(--text-secondary)}

  .filter-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .filter-row .dropdown:nth-child(3){grid-column:1 / -1}
  @media (max-width:420px){
    .filter-row{grid-template-columns:1fr}
    .filter-row .dropdown:nth-child(3){grid-column:auto}
  }
  .dropdown{position:relative;width:100%}
  .cat-select{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit;max-width:100%}
  .cat-select svg{flex-shrink:0;transition:transform .15s}
  .cat-select[aria-expanded="true"] svg{transform:rotate(180deg)}
  .cat-select span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cat-menu{position:absolute;left:0;top:calc(100% + 6px);min-width:200px;max-width:90vw;max-height:260px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 28px rgba(0,0,0,.15);z-index:15;display:none;padding:6px}
  .cat-menu.open{display:block}
  .cat-menu-item{padding:10px 12px;font-size:14px;border-radius:9px;cursor:pointer;color:var(--text)}
  .cat-menu-item:hover{background:var(--bg)}
  .cat-menu-item.active{background:var(--badge-play-bg);color:var(--badge-play-text);font-weight:600}
  .results-count{font-size:12px;color:var(--text-secondary);margin:0 0 14px;padding:0 2px}

  .category-header{margin:22px 0 12px;padding:0 2px}
  .category-header:first-child{margin-top:0}
  .category-title-row{display:flex;align-items:baseline;gap:8px}
  .category-title{font-size:16px;font-weight:800;letter-spacing:-.2px;background:linear-gradient(135deg,#4f7cff 0%,#7b5cff 40%,#c04cff 70%,#ff5f8f 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .category-count{font-size:11.5px;font-weight:600;color:var(--text-secondary)}
  .category-divider{height:3px;width:52px;border-radius:3px;margin-top:6px;background:linear-gradient(90deg,#4f7cff 0%,#7b5cff 40%,#c04cff 70%,#ff5f8f 100%)}

  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--text-secondary);margin:0 0 14px;padding:0 2px}
  .legend summary{cursor:pointer;font-weight:600;color:var(--text-secondary);list-style:none}
  .legend summary::-webkit-details-marker{display:none}
  .legend summary::after{content:'· ¿Qué significa esto?';font-weight:400;margin-left:4px}
  .legend[open] summary::after{content:''}
  .legend-items{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:8px}
  .legend-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
  .legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

  .app-row{display:flex;flex-wrap:wrap;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .app-main{display:flex;gap:14px;flex:1;min-width:220px}
  .app-icon{width:52px;height:52px;border-radius:14px;flex-shrink:0;object-fit:cover;background:#eee;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px;overflow:hidden}
  .app-body{flex:1;min-width:0;display:flex;flex-direction:column}
  .app-name{font-weight:700;font-size:15px;margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app-meta{font-size:12.5px;color:var(--text-secondary);margin:0 0 4px}
  .app-desc{font-size:12.5px;color:var(--text-secondary);margin:0 0 8px;line-height:1.45;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .app-tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:auto}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
  .badge-github{background:var(--badge-github-bg);color:var(--badge-github-text)}
  .badge-web{background:var(--badge-web-bg);color:var(--badge-web-text)}
  .badge-play{background:var(--badge-play-bg);color:var(--badge-play-text)}
  .badge-external{background:var(--badge-external-bg);color:var(--badge-external-text)}
  .badge-telegram{background:var(--badge-telegram-bg);color:var(--badge-telegram-text)}
  .status-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 10px 3px 8px;border-radius:20px}
  .status-ok{background:var(--status-ok-bg);color:var(--status-ok-text)}
  .status-regular{background:var(--status-regular-bg);color:var(--status-regular-text)}
  .status-down{background:var(--status-down-bg);color:var(--status-down-text)}
  .status-dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
  .warn-icon{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--status-regular-bg);color:var(--status-regular-text);font-size:11px;cursor:default}
  .app-actions-col{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:auto}
  .btn-download{background:var(--green);color:#fff;border:none;padding:10px 20px;border-radius:20px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block;transition:background .15s;white-space:nowrap}
  .btn-download:hover{background:var(--green-dark)}
  .btn-share{background:var(--bg);border:1px solid var(--border);color:var(--text-secondary);width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
  .btn-share:active{background:var(--border)}
  @media (max-width:480px){
    .app-actions-col{flex-basis:100%;margin-left:0;margin-top:4px}
    .btn-download{flex:1;text-align:center}
  }

  .sheet-overlay{position:fixed;inset:0;background:var(--overlay);z-index:30;display:none;align-items:flex-end;justify-content:center}
  .sheet-overlay.open{display:flex}
  .sheet{background:var(--card);width:100%;max-width:700px;border-radius:20px 20px 0 0;padding:18px 18px 26px;max-height:80vh;overflow-y:auto}
  .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
  .sheet h2{font-size:16px;margin:0 0 4px;font-weight:700}
  .sheet .sheet-sub{font-size:12.5px;color:var(--text-secondary);margin:0 0 16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:8px}
  .share-item{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:none;cursor:pointer;font-family:inherit;padding:8px 4px;border-radius:14px}
  .share-item:active{background:var(--bg)}
  .share-item img{width:48px;height:48px;border-radius:14px}
  .share-item span{font-size:12px;font-weight:600;color:var(--text)}
  .btn-ghost{background:transparent;color:var(--text-secondary);border:none;padding:12px;font-size:14px;font-weight:600;width:100%;cursor:pointer;font-family:inherit}

  .app-row{cursor:pointer}
  .app-row a,.app-row button{cursor:pointer}
  .detail-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
  .detail-icon{width:64px;height:64px;border-radius:16px;flex-shrink:0;object-fit:cover;background:#eee;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;overflow:hidden}
  .detail-info{flex:1;min-width:0}
  .detail-name{font-weight:800;font-size:18px;margin:0 0 3px}
  .detail-meta{font-size:12.5px;color:var(--text-secondary);margin:0 0 8px}
  .detail-tags{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .detail-desc{font-size:13.5px;line-height:1.55;color:var(--text);margin:0 0 20px;white-space:pre-line}
  .detail-actions{display:flex;gap:8px}
  .detail-actions .btn-download{flex:1;text-align:center;padding:12px 20px;font-size:14px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1c1e;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90%;text-align:center}
  .toast.show{opacity:1}

  .empty{text-align:center;padding:60px 20px;color:var(--text-secondary)}
  .empty svg{margin-bottom:12px;opacity:.5}
  .btn-clear-filters{margin-top:16px;background:transparent;color:var(--green);border:1px solid var(--green);padding:9px 18px;border-radius:20px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
  .load-panel{background:var(--card);border:1px dashed var(--border);border-radius:16px;padding:24px;text-align:center;margin-bottom:20px}
  .load-panel p{color:var(--text-secondary);font-size:13px;margin:0 0 12px}
  .btn-secondary{background:transparent;color:var(--green);border:1px solid var(--green);padding:9px 18px;border-radius:20px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 9.5 12 4l8 5.5V19a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1V9.5Z" fill="#fff"/>
        </svg>
      </div>
      <div class="logo-text">NovaStore</div>
    </div>
    <button class="icon-btn" id="btn-theme" aria-label="Cambiar tema"></button>
  </div>
</header>

<main>
  <div class="searchbar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="search-input" placeholder="Buscar apps">
  </div>

  <div class="filter-row">
    <div class="dropdown">
      <button class="cat-select" id="cat-select-btn" aria-haspopup="listbox" aria-expanded="false">
        <span id="cat-select-label">Todas las categorías</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="cat-menu" id="cat-menu"></div>
    </div>
    <div class="dropdown">
      <button class="cat-select" id="status-select-btn" aria-haspopup="listbox" aria-expanded="false">
        <span id="status-select-label">Cualquier estado</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="cat-menu" id="status-menu"></div>
    </div>
    <div class="dropdown">
      <button class="cat-select" id="sort-select-btn" aria-haspopup="listbox" aria-expanded="false">
        <span id="sort-select-label">Recientes</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="cat-menu" id="sort-menu"></div>
    </div>
  </div>

  <details class="legend">
    <summary>Leyenda</summary>
    <div class="legend-items">
      <span class="legend-item"><span class="legend-dot" style="background:var(--status-ok-text)"></span>Funcionando</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--status-regular-text)"></span>Regular</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--status-down-text)"></span>No funciona</span>
      <span class="legend-item" id="legend-ads">Contiene publicidad</span>
      <span class="legend-item" id="legend-sub">Requiere suscripción de pago</span>
    </div>
  </details>

  <p class="results-count" id="results-count"></p>

  <div class="load-panel" id="load-panel" style="display:none">
    <p>No se pudo cargar apps.json automáticamente (esto pasa si abres el archivo con doble clic en lugar de un servidor local). Selecciónalo a mano:</p>
    <button class="btn-secondary" onclick="document.getElementById('file-input').click()">Seleccionar apps.json</button>
    <input type="file" id="file-input" accept=".json" style="display:none">
  </div>

  <div id="app-list"></div>
</main>

<div class="sheet-overlay" id="share-sheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Compartir aplicación</h2>
    <p class="sheet-sub" id="share-app-name"></p>
    <div class="share-grid">
      <button class="share-item" id="share-whatsapp"><img src="" alt="WhatsApp"><span>WhatsApp</span></button>
      <button class="share-item" id="share-telegram"><img src="" alt="Telegram"><span>Telegram</span></button>
      <button class="share-item" id="share-instagram"><img src="" alt="Instagram"><span>Instagram</span></button>
      <button class="share-item" id="share-tiktok"><img src="" alt="TikTok"><span>TikTok</span></button>
    </div>
    <button class="btn-ghost" id="btn-cerrar-share">Cancelar</button>
  </div>
</div>

<div class="sheet-overlay" id="detail-sheet">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="detail-head">
      <div id="detail-icon-slot"></div>
      <div class="detail-info">
        <p class="detail-name" id="detail-name"></p>
        <p class="detail-meta" id="detail-meta"></p>
        <div class="detail-tags" id="detail-tags"></div>
      </div>
    </div>
    <p class="detail-desc" id="detail-desc"></p>
    <div class="detail-actions">
      <button class="btn-share" id="detail-share-btn" aria-label="Compartir"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-3.9M8.6 13.5l6.8 3.9"/></svg></button>
      <a class="btn-download" id="detail-download" target="_blank" rel="noopener">Ir a la fuente</a>
    </div>
    <button class="btn-ghost" id="btn-cerrar-detail">Cerrar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let apps=[];
let categorias=[];
let selectedCategory='';
let selectedStatus='';
let sortMode='recientes';

// --- tema claro/oscuro ---
const MOON_SVG='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>';
const SUN_SVG='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
function applyThemeUI(theme){
  document.getElementById('btn-theme').innerHTML=theme==='dark'?SUN_SVG:MOON_SVG;
}
let currentTheme=document.documentElement.getAttribute('data-theme')||'light';
applyThemeUI(currentTheme);
document.getElementById('btn-theme').addEventListener('click',()=>{
  currentTheme=currentTheme==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',currentTheme);
  try{localStorage.setItem('novastore_theme',currentTheme)}catch(e){}
  applyThemeUI(currentTheme);
});

function hashColor(str){
  let hash=0;
  for(let i=0;i<str.length;i++){hash=str.charCodeAt(i)+((hash<<5)-hash);}
  const hue=Math.abs(hash)%360;
  return `hsl(${hue},58%,48%)`;
}
function initials(name){return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()}
function escapeHtml(str){
  return String(str??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function badgeFor(tipo){
  if(tipo==='github')return '<span class="badge badge-github">GitHub</span>';
  if(tipo==='web')return '<span class="badge badge-web">Web oficial</span>';
  if(tipo==='telegram')return '<span class="badge badge-telegram">Telegram</span>';
  if(tipo==='external')return '<span class="badge badge-external">Enlace externo</span>';
  return '<span class="badge badge-play">Play Store</span>';
}
function statusPillHtml(estado){
  if(estado==='regular')return `<span class="status-pill status-regular"><span class="status-dot"></span>Regular</span>`;
  if(estado==='down')return `<span class="status-pill status-down"><span class="status-dot"></span>No funciona</span>`;
  return `<span class="status-pill status-ok"><span class="status-dot"></span>Funcionando</span>`;
}
// Aviso discreto (icono + tooltip) si la app tiene publicidad o requiere suscripción de pago.
// Iconos en línea, mismo estilo (stroke, sin relleno) que el resto del sitio — nada de emoji ni CDNs externos.
const ADS_SVG='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>';
const SUB_SVG='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>';
function warnIconsHtml(app){
  let html='';
  if(app.ads)html+=`<span class="warn-icon" title="Contiene publicidad">${ADS_SVG}</span>`;
  if(app.suscripcion)html+=`<span class="warn-icon" title="Requiere suscripción de pago">${SUB_SVG}</span>`;
  return html;
}
// La fecha se guarda como YYYY-MM-DD desde el admin; aquí se muestra como dd/mm/aaaa.
function formatFecha(fecha){
  if(!fecha)return '';
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(fecha);
  if(!m)return fecha;
  return `${m[3]}/${m[2]}/${m[1]}`;
}
// Si el peso es solo un número (p.ej. "46") le añade "MB" para que no se vea suelto.
function formatPeso(peso){
  if(!peso)return '—';
  const p=String(peso).trim();
  return /^\d+([.,]\d+)?$/.test(p)?`${p} MB`:p;
}

function buildFallbackIconEl(name,tipo){
  if(BRAND_ICONS[tipo]){
    const img=document.createElement('img');
    img.className='app-icon';
    img.src=BRAND_ICONS[tipo];
    img.alt='';
    return img;
  }
  const div=document.createElement('div');
  div.className='app-icon';
  div.style.background=hashColor(name);
  div.textContent=initials(name||'?');
  return div;
}
// El icono se crea siempre con el DOM (nunca insertando HTML dentro de un atributo
// onerror como string), así evitamos que las comillas rompan el markup.
function buildIconEl(app){
  const name=app.nombre||'app';
  const tipo=app.tipo||'web';
  if(app.icono){
    const img=document.createElement('img');
    img.className='app-icon';
    img.src=app.icono;
    img.alt='';
    img.addEventListener('error',()=>{
      img.replaceWith(buildFallbackIconEl(name,tipo));
    },{once:true});
    return img;
  }
  return buildFallbackIconEl(name,tipo);
}

// --- categorías / estado / orden (3 desplegables con el mismo patrón) ---
function effectiveCategorias(){
  if(categorias.length)return categorias;
  return [...new Set(apps.map(a=>a.categoria).filter(Boolean))];
}
function renderCategoryMenu(){
  const menu=document.getElementById('cat-menu');
  const cats=effectiveCategorias();
  const items=['',...cats];
  menu.innerHTML=items.map(c=>`<div class="cat-menu-item ${c===selectedCategory?'active':''}" data-cat="${escapeHtml(c)}">${c?escapeHtml(c):'Todas las categorías'}</div>`).join('');
  menu.querySelectorAll('.cat-menu-item').forEach(el=>{
    el.addEventListener('click',()=>{
      selectedCategory=el.dataset.cat;
      document.getElementById('cat-select-label').textContent=selectedCategory||'Todas las categorías';
      closeAllMenus();
      renderCatalog();
    });
  });
}
const STATUS_OPTIONS=[
  {value:'',label:'Cualquier estado'},
  {value:'ok',label:'Funcionando'},
  {value:'regular',label:'Regular'},
  {value:'down',label:'No funciona'}
];
function renderStatusMenu(){
  const menu=document.getElementById('status-menu');
  menu.innerHTML=STATUS_OPTIONS.map(o=>`<div class="cat-menu-item ${o.value===selectedStatus?'active':''}" data-status="${o.value}">${o.label}</div>`).join('');
  menu.querySelectorAll('.cat-menu-item').forEach(el=>{
    el.addEventListener('click',()=>{
      selectedStatus=el.dataset.status;
      document.getElementById('status-select-label').textContent=STATUS_OPTIONS.find(o=>o.value===selectedStatus).label;
      closeAllMenus();
      renderCatalog();
    });
  });
}
const SORT_OPTIONS=[
  {value:'recientes',label:'Recientes'},
  {value:'az',label:'Nombre (A-Z)'},
  {value:'za',label:'Nombre (Z-A)'}
];
function renderSortMenu(){
  const menu=document.getElementById('sort-menu');
  menu.innerHTML=SORT_OPTIONS.map(o=>`<div class="cat-menu-item ${o.value===sortMode?'active':''}" data-sort="${o.value}">${o.label}</div>`).join('');
  menu.querySelectorAll('.cat-menu-item').forEach(el=>{
    el.addEventListener('click',()=>{
      sortMode=el.dataset.sort;
      document.getElementById('sort-select-label').textContent=SORT_OPTIONS.find(o=>o.value===sortMode).label;
      closeAllMenus();
      renderCatalog();
    });
  });
}
function closeAllMenus(){
  ['cat-menu','status-menu','sort-menu'].forEach(id=>document.getElementById(id).classList.remove('open'));
  ['cat-select-btn','status-select-btn','sort-select-btn'].forEach(id=>document.getElementById(id).setAttribute('aria-expanded','false'));
}
function toggleMenu(btnId,menuId,renderFn){
  const menu=document.getElementById(menuId);
  const isOpen=menu.classList.contains('open');
  closeAllMenus();
  if(!isOpen){
    renderFn();
    menu.classList.add('open');
    document.getElementById(btnId).setAttribute('aria-expanded','true');
  }
}
document.getElementById('cat-select-btn').addEventListener('click',()=>toggleMenu('cat-select-btn','cat-menu',renderCategoryMenu));
document.getElementById('status-select-btn').addEventListener('click',()=>toggleMenu('status-select-btn','status-menu',renderStatusMenu));
document.getElementById('sort-select-btn').addEventListener('click',()=>toggleMenu('sort-select-btn','sort-menu',renderSortMenu));
document.addEventListener('click',e=>{
  if(!e.target.closest('.filter-row'))closeAllMenus();
});

function clearAllFilters(){
  selectedCategory='';
  selectedStatus='';
  document.getElementById('search-input').value='';
  document.getElementById('cat-select-label').textContent='Todas las categorías';
  document.getElementById('status-select-label').textContent='Cualquier estado';
  renderCatalog();
}

function applyFilters(){
  const q=(document.getElementById('search-input').value||'').toLowerCase();
  let result=apps.filter(a=>{
    const matchesQ=(a.nombre||'').toLowerCase().includes(q);
    const matchesCat=!selectedCategory||(a.categoria||'')===selectedCategory;
    const matchesStatus=!selectedStatus||(a.estado||'ok')===selectedStatus;
    return matchesQ&&matchesCat&&matchesStatus;
  });
  if(sortMode==='az')result=result.slice().sort((a,b)=>(a.nombre||'').localeCompare(b.nombre||'','es',{sensitivity:'base'}));
  else if(sortMode==='za')result=result.slice().sort((a,b)=>(b.nombre||'').localeCompare(a.nombre||'','es',{sensitivity:'base'}));
  return result;
}

function buildAppRowEl(app){
  const row=document.createElement('div');
  row.className='app-row';

  const main=document.createElement('div');
  main.className='app-main';
  main.appendChild(buildIconEl(app));

  const info=document.createElement('div');
  info.className='app-body';
  info.innerHTML=`
    <p class="app-name">${escapeHtml(app.nombre)}</p>
    <p class="app-meta">${escapeHtml(app.categoria||'General')}${app.fecha?` · Actualizado ${formatFecha(app.fecha)}`:''}</p>
    ${app.descripcion?`<p class="app-desc">${escapeHtml(app.descripcion)}</p>`:''}
    <div class="app-tags">${badgeFor(app.tipo)}${statusPillHtml(app.estado)}${warnIconsHtml(app)}</div>
  `;
  main.appendChild(info);
  row.appendChild(main);

  const actions=document.createElement('div');
  actions.className='app-actions-col';
  const shareBtn=document.createElement('button');
  shareBtn.className='btn-share';
  shareBtn.setAttribute('aria-label','Compartir');
  shareBtn.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-3.9M8.6 13.5l6.8 3.9"/></svg>';
  shareBtn.addEventListener('click',e=>{e.stopPropagation();openShareSheet(app)});
  actions.appendChild(shareBtn);
  const link=document.createElement('a');
  link.className='btn-download';
  link.href=app.url;
  link.target='_blank';
  link.rel='noopener';
  link.textContent='Descargar';
  link.addEventListener('click',e=>e.stopPropagation());
  actions.appendChild(link);
  row.appendChild(actions);

  // Al pulsar en cualquier parte de la fila (fuera de los botones de arriba) se abre
  // la ficha de la app con la descripción completa y el enlace a la fuente.
  row.addEventListener('click',()=>openDetailSheet(app));

  return row;
}

// Cabecera de sección por categoría: título degradado (mismo estilo que el logo) + contador + barra degradada.
function buildCategoryHeaderEl(cat,count){
  const header=document.createElement('div');
  header.className='category-header';
  header.innerHTML=`
    <div class="category-title-row">
      <span class="category-title">${escapeHtml(cat)}</span>
      <span class="category-count">${count}</span>
    </div>
    <div class="category-divider"></div>
  `;
  return header;
}

function renderCatalog(){
  const list=document.getElementById('app-list');
  const filtered=applyFilters();
  const countEl=document.getElementById('results-count');
  const hasActiveFilters=!!(selectedCategory||selectedStatus||(document.getElementById('search-input').value||'').trim());
  countEl.textContent=apps.length?`${filtered.length} ${filtered.length===1?'app':'apps'}${hasActiveFilters?` de ${apps.length}`:''}`:'';
  if(filtered.length===0){
    list.innerHTML=`<div class="empty">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 9h6v6H9z"/></svg>
      <p>${apps.length===0?'Todavía no hay apps en apps.json.':'No hay resultados con estos filtros.'}</p>
      ${apps.length>0&&hasActiveFilters?'<button class="btn-clear-filters" id="btn-clear-filters">Quitar filtros</button>':''}
    </div>`;
    const clearBtn=document.getElementById('btn-clear-filters');
    if(clearBtn)clearBtn.addEventListener('click',clearAllFilters);
    return;
  }
  list.innerHTML='';

  // Si ya se ha filtrado por una categoría concreta, todos los resultados son de esa
  // categoría: no hace falta repetir cabeceras, se muestra la lista plana.
  if(selectedCategory){
    filtered.forEach(app=>list.appendChild(buildAppRowEl(app)));
    return;
  }

  // Sin filtro de categoría: se agrupa "a lo tienda", con un título degradado por sección.
  const groups=new Map();
  filtered.forEach(app=>{
    const cat=app.categoria||'General';
    if(!groups.has(cat))groups.set(cat,[]);
    groups.get(cat).push(app);
  });
  let order=effectiveCategorias().filter(c=>groups.has(c));
  [...groups.keys()].forEach(c=>{if(!order.includes(c))order.push(c)});
  if(sortMode==='az')order=order.slice().sort((a,b)=>a.localeCompare(b,'es',{sensitivity:'base'}));
  else if(sortMode==='za')order=order.slice().sort((a,b)=>b.localeCompare(a,'es',{sensitivity:'base'}));

  order.forEach(cat=>{
    const items=groups.get(cat);
    if(!items||!items.length)return;
    list.appendChild(buildCategoryHeaderEl(cat,items.length));
    items.forEach(app=>list.appendChild(buildAppRowEl(app)));
  });
}

function loadData(parsed){
  if(Array.isArray(parsed)){
    apps=parsed;
    categorias=[...new Set(apps.map(a=>a.categoria).filter(Boolean))];
  }else{
    apps=parsed.apps||[];
    categorias=parsed.categorias||[];
  }
  renderCatalog();
  handleDeepLink();
}

// Si venimos de una página share/{slug}.html (enlace compartido en WhatsApp/Telegram),
// resaltamos y hacemos scroll hasta la app correspondiente.
function handleDeepLink(){
  const params=new URLSearchParams(location.search);
  const slug=params.get('app');
  if(!slug)return;
  const app=apps.find(a=>a.slug===slug);
  if(!app)return;
  document.getElementById('search-input').value=app.nombre;
  renderCatalog();
  setTimeout(()=>{
    const row=document.querySelector('#app-list .app-row');
    if(row){
      row.scrollIntoView({behavior:'smooth',block:'center'});
      row.style.outline=`2px solid var(--green)`;
      row.style.outlineOffset='2px';
    }
  },50);
}

async function loadFromFetch(){
  try{
    const res=await fetch('apps.json',{cache:'no-store'});
    if(!res.ok)throw new Error('no ok');
    loadData(await res.json());
  }catch(e){
    document.getElementById('load-panel').style.display='block';
  }
}

document.getElementById('file-input').addEventListener('change',e=>{
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      loadData(JSON.parse(ev.target.result));
      document.getElementById('load-panel').style.display='none';
    }catch(err){alert('El archivo no es un JSON válido')}
  };
  reader.readAsText(file);
});

document.getElementById('search-input').addEventListener('input',renderCatalog);

// --- compartir app ---
document.getElementById('share-whatsapp').querySelector('img').src=BRAND_ICONS.whatsapp;
document.getElementById('share-telegram').querySelector('img').src=BRAND_ICONS.telegram;
document.getElementById('share-instagram').querySelector('img').src=BRAND_ICONS.instagram;
document.getElementById('share-tiktok').querySelector('img').src=BRAND_ICONS.tiktok;

// Icono + texto en la leyenda de avisos (mismo SVG que en las tarjetas)
document.getElementById('legend-ads').innerHTML=`<span class="warn-icon">${ADS_SVG}</span> Contiene publicidad`;
document.getElementById('legend-sub').innerHTML=`<span class="warn-icon">${SUB_SVG}</span> Requiere suscripción de pago`;

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.classList.remove('show'),2600);
}
function openSheetEl(id){document.getElementById(id).classList.add('open')}
function closeSheetEl(id){document.getElementById(id).classList.remove('open')}

// URL pública de la app (raíz del sitio: mismo dominio donde vive index.html)
function siteBase(){
  return location.href.split('#')[0].split('?')[0].replace(/[^/]*$/,'');
}
// Si el admin generó una página de vista previa (share/slug.html) para esta app,
// compartimos esa página: así WhatsApp/Telegram muestran banner, título y descripción.
// Si la app todavía no tiene "slug" (apps antiguas), se comparte el enlace directo.
function shareUrlFor(app){
  return app.slug ? `${siteBase()}share/${app.slug}.html` : app.url;
}

// --- ficha de detalle de la app (icono grande, descripción completa, ir a la fuente) ---
let detailTarget=null;
function openDetailSheet(app){
  detailTarget=app;
  document.getElementById('detail-icon-slot').innerHTML='';
  const icon=buildIconEl(app);
  icon.classList.remove('app-icon');
  icon.classList.add('detail-icon');
  document.getElementById('detail-icon-slot').appendChild(icon);
  document.getElementById('detail-name').textContent=app.nombre;
  document.getElementById('detail-meta').textContent=`${app.categoria||'General'}${app.fecha?` · Actualizado ${formatFecha(app.fecha)}`:''}`;
  document.getElementById('detail-tags').innerHTML=`${badgeFor(app.tipo)}${statusPillHtml(app.estado)}${warnIconsHtml(app)}`;
  document.getElementById('detail-desc').textContent=app.descripcion||'Sin descripción todavía.';
  const dl=document.getElementById('detail-download');
  dl.href=app.url;
  dl.textContent='Ir a la fuente';
  openSheetEl('detail-sheet');
}
document.getElementById('detail-share-btn').addEventListener('click',()=>{
  if(detailTarget)openShareSheet(detailTarget);
});
document.getElementById('btn-cerrar-detail').addEventListener('click',()=>closeSheetEl('detail-sheet'));
document.getElementById('detail-sheet').addEventListener('click',e=>{if(e.target.id==='detail-sheet')closeSheetEl('detail-sheet')});

let shareTarget=null;
function openShareSheet(app){
  shareTarget=app;
  document.getElementById('share-app-name').textContent=app.nombre;
  openSheetEl('share-sheet');
}
async function copyLinkAndNotify(app,network){
  const link=shareUrlFor(app);
  try{
    await navigator.clipboard.writeText(link);
    showToast(`Enlace copiado. Pégalo en ${network} para compartir "${app.nombre}".`);
  }catch(e){
    showToast(`Copia este enlace para compartir en ${network}: ${link}`);
  }
}
// Mensaje de texto que acompaña al enlace: mismo formato en WhatsApp y Telegram.
// El "Enlace" es siempre la página de NovaStore (share/slug.html), nunca la
// URL directa de Play Store/GitHub, para que la persona entre primero a la web.
function shareMessageFor(app){
  const lineas=[`Título: ${app.nombre}`];
  if(app.peso)lineas.push(`Peso: ${formatPeso(app.peso)}`);
  lineas.push(`Descripción: ${app.descripcion||'—'}`);
  lineas.push(`Enlace: ${shareUrlFor(app)}`);
  return lineas.join('\n');
}
document.getElementById('share-whatsapp').addEventListener('click',()=>{
  if(!shareTarget)return;
  window.open(`https://wa.me/?text=${encodeURIComponent(shareMessageFor(shareTarget))}`,'_blank','noopener');
  closeSheetEl('share-sheet');
});
document.getElementById('share-telegram').addEventListener('click',()=>{
  if(!shareTarget)return;
  // En Telegram, "url" alimenta la vista previa (banner) y "text" es el pie de mensaje.
  window.open(`https://t.me/share/url?url=${encodeURIComponent(shareUrlFor(shareTarget))}&text=${encodeURIComponent(shareMessageFor(shareTarget))}`,'_blank','noopener');
  closeSheetEl('share-sheet');
});
document.getElementById('share-instagram').addEventListener('click',()=>{
  if(!shareTarget)return;
  copyLinkAndNotify(shareTarget,'Instagram');
  closeSheetEl('share-sheet');
});
document.getElementById('share-tiktok').addEventListener('click',()=>{
  if(!shareTarget)return;
  copyLinkAndNotify(shareTarget,'TikTok');
  closeSheetEl('share-sheet');
});
document.getElementById('btn-cerrar-share').addEventListener('click',()=>closeSheetEl('share-sheet'));
document.getElementById('share-sheet').addEventListener('click',e=>{if(e.target.id==='share-sheet')closeSheetEl('share-sheet')});

loadFromFetch();
</script>
</body>
