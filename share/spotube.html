<style>
  :root{--green:#01875f;--bg:#f6f8f7;--card:#ffffff;--border:#e3e7e5;--text:#1a1c1e;--text-secondary:#5f6368}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);padding:20px}
  .card{max-width:480px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 26px;box-shadow:0 4px 20px rgba(16,24,22,.08)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .brand-mark{width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:linear-gradient(135deg,#4f7cff 0%,#7b5cff 30%,#c04cff 60%,#ff5f8f 100%);color:#fff}
  .brand-name{font-weight:800;font-size:18px;letter-spacing:-.3px;background:linear-gradient(135deg,#4f7cff,#c04cff 60%,#ff5f8f);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{font-size:22px;margin:0 0 6px}
  .meta{font-size:13px;color:var(--text-secondary);margin:0 0 14px}
  .desc{font-size:14px;color:var(--text-secondary);line-height:1.5;margin:0 0 22px}
  .btn{display:block;text-align:center;background:var(--green);color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:13px;border-radius:14px}
  .btn:active{opacity:.85}
  .foot{margin-top:14px;text-align:center;font-size:12px;color:var(--text-secondary)}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">NV</div>
      <div class="brand-name">NovaStore</div>
    </div>
    <h1>Spotube</h1>
    <p class="meta">122 MB  ·  Música Streaming</p>
    <p class="desc">Musica streaming sin publicidad.</p>
    <a class="btn" href="../index.html?app=spotube">Ver en NovaStore</a>
    <p class="foot">Si han inventado la app, está aquí.</p>
  </div>
</body>
